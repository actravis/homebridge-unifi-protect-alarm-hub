name: CI

# Every branch, not just main. Feature work here is long-lived — `cameras-and-streaming` reached 24
# commits, all of it invisible to CI, because a main-only push trigger never fired and the workflow
# file does not exist on main for workflow_dispatch to offer. A branch that cannot run CI is a branch
# whose engines-floor claim is untested until merge day.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo, so the token gets read-only access. Without
# this, a compromised dependency running in a postinstall script would inherit a write token.
permissions:
  contents: read

# Superseded runs on the same branch are pointless; cancel them rather than queue them. Keyed on the
# HEAD branch rather than github.ref so that a push run and a pull_request run for the same branch
# share one group: with every branch now triggering on push, a same-repo PR would otherwise run the
# whole matrix twice (github.ref is refs/heads/x for the push and refs/pull/N/merge for the PR).
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

# `npm ci --omit=optional` throughout: the only optional dependency is ffmpeg-for-homebridge,
# whose postinstall downloads a large platform binary. Nothing under test spawns ffmpeg, and
# omitting it also exercises resolveFfmpegPath's fall back to a system ffmpeg.

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is package.json's `engines.node`; the rest are the LTS lines Homebridge
        # users actually run on.
        node: ['18.17', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --omit=optional

      # `npm test` runs `tsc` first (the tests import from dist/), so this covers the build too.
      - run: npm test

  lint:
    # Lint runs on one modern Node only: eslint 10 and typescript-eslint 8 both require a newer
    # runtime than the plugin itself does, and the linter's opinion doesn't vary by Node version.
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=optional
      - run: npm run lint

  homebridge-v2:
    # `engines.homebridge` claims support for the v2 beta while devDependencies pin v1.8, so
    # nothing ever type-checks against v2's typings. Informational until v2 ships: a failure
    # here means that compatibility claim needs revisiting, not that main is broken.
    name: Type-check against Homebridge v2 beta
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=optional
      - run: npm install --no-save --omit=optional homebridge@beta
      - run: npx tsc --noEmit

  audit:
    # This plugin runs inside Homebridge with the console API key in reach, so a vulnerable
    # transitive dependency is a real exposure rather than a formality.
    #
    # Two thresholds, because the blast radius differs. Runtime deps fail at MODERATE: there is
    # only one (undici), and it carries every HTTPS call, the API key and the realtime socket — a
    # "moderate" there is not moderate for us. Three undici advisories sat unnoticed under a
    # high-only gate, including response desynchronisation via the retry interceptor, which this
    # client uses. Dev deps fail at HIGH: they cannot reach the console, but they do build what
    # gets published.
    name: Audit dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high

  secrets:
    # Rule: secrets never reach logs, commits, or artifacts. The pattern layer catches unknown
    # secrets by shape; the hash denylist in .secret-hashes catches known-real values that look
    # ordinary (a live webhook Trigger ID is just a UUID). Same command CI and local, so the two
    # cannot drift.
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step: the scanner is dependency-free by design, so a compromised dependency
      # cannot influence the check that looks for leaked credentials.
      - run: npm run scan:secrets
